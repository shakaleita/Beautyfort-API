name: Legacy PHP syntax checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
          coverage: none
      - name: Validate plugin PHP syntax
        run: php -l Plugin/BeautyFort.php
      - name: Validate example syntax
        run: php -l example.php
